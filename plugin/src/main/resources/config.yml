supabase:
  url: "https://DEIN-PROJEKT.supabase.co"
  # Secret Key (sb_secret_...) bzw. service_role-Key. NIEMALS veröffentlichen oder committen!
  secret-key: "HIER-SECRET-KEY-EINTRAGEN"
# Wie oft Spielzeit und Kontostand übertragen werden
sync-interval-seconds: 60
http:
  timeout-ms: 5000
  retries: 2
pvp:
  # Permission, die PvP erlaubt (in LuckPerms vergeben)
  permission: "pvp"
  # LuckPerms-Gruppe, in die der Website-Schalter den Spieler aufnimmt bzw. daraus entfernt
  group: "pvp"
