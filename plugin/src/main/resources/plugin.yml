name: FrogCraftStats
version: 1.1.0
main: de.frogcraft.stats.FrogCraftStats
api-version: '1.21'
description: Überträgt Spielerstatistiken nach Supabase, /top-Ranglisten, PvP-Rolle und Website-Verifizierung.
softdepend: [Vault, LuckPerms]
commands:
  top:
    description: Zeigt Ranglisten (Geld, Kills, Spielzeit)
    usage: /top <geld|kills|zeit>
    aliases: [rangliste]
    permission: frogcraft.top
  verify:
    description: Bestätigt dein Website-Konto
    usage: /verify <Code>
    aliases: [verifizieren]
  pvp:
    description: Zeigt deinen PvP-Status
    usage: /pvp
permissions:
  frogcraft.top:
    description: Erlaubt /top
    default: true
  pvp:
    description: PvP-Rolle - nur Spieler mit dieser Permission können PvP machen (per LuckPerms vergeben)
    default: false
